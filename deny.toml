# cargo-deny configuration for license and security checking

[advisories]
# Transitive GTK3/Tauri and other unmaintained crates — tracked, no upstream fix yet.
ignore = [
    "RUSTSEC-2021-0140",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0186",
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
