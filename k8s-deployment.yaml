apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-marketing-website
  labels:
    app: ghost-marketing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ghost-marketing
  template:
    metadata:
      labels:
        app: ghost-marketing
    spec:
      containers:
      - name: website
        image: mohabbis/ghost-marketing:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ghost-marketing-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: ghost-marketing
