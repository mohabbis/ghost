[package]
name = "ghost"
version = "2.0.4"
edition = "2024"

[lib]
name = "ghost_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Signed auto-update. The app checks an endpoint, verifies the update signature
# against the embedded public key, and installs only after the user approves
# (see commands/updates.rs). Update artifacts + signatures are produced by the
# release workflow when the updater signing key is configured.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
# reqwest 0.13 dropped `query`/`form` from the blocking RequestBuilder;
# form_urlencoded (already in the tree via `url`) builds the OAuth token
# request body, and query strings go through `reqwest::Url::parse_with_params`.
form_urlencoded = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-chrome = { version = "0.7", optional = true }
image = "0.25"
ssim = "0.1"
rusttype = "0.9"
threadpool = "1.8"
base64 = "0.22"
async-trait = "0.1"
regex = "1.10"
dirs = "6"
argon2 = "0.5"
aes-gcm = "0.10"
# SHA-256 for the tamper-evident audit hash chain over Organizer executions
# (see storage/executions.rs). RustCrypto, MIT/Apache-2.0 (passes deny.toml).
sha2 = "0.11"
# Route deletes through the OS Recycle Bin / Trash (freedesktop on Linux, Finder
# Trash on macOS, Recycle Bin on Windows) so a delete is recoverable at the OS
# level, not only via Ghost's internal undo journal. Used by organizer/trash.rs.
trash = "5"
# Local trust-boundary storage (Zones + folder rules), Organizer execution
# history, and milestones — pure-Rust embedded KV store, no bundled C library.
# See storage/mod.rs. MIT/Apache-2.0 (passes deny.toml).
redb = "4"
# Read-only, one-time-migration use only: opening a pre-redb `ghost.db` SQLite
# file so its contents can be imported into redb (see storage/sqlite_import.rs
# and storage/migrations.rs, which still runs the legacy V1-V6 schema
# migrations against that file before it's read). `bundled` compiles SQLite
# from source so there is no system-library dependency and it builds on the
# headless Linux CI leg. MIT-licensed (passes deny.toml).
# Pinned below 0.40: rusqlite >=0.40.1 requires libsqlite3-sys ^0.38.1, whose
# build script uses the unstable `cfg_select!` macro and fails to compile on
# stable Rust (rust-lang/rust#115585). 0.39 pulls libsqlite3-sys 0.37, which
# predates the bug. Bump once a fixed libsqlite3-sys ships.
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-dialog = "2"
# Parallel directory walker for the Organizer scanner
# (src-tauri/src/organizer/scanner.rs). Reads directories across a thread
# pool to speed up deep-tree scans; scanner.rs still sorts the result into a
# deterministic order before it reaches the planner. MIT/Apache-2.0.
jwalk = "0.8"
# Local GGUF model inference (core/local_llm.rs), gated behind the
# `experimental` feature below — optional so a stock build never pulls these
# in. Pure-Rust CPU backend only (no cuda/metal/mkl features enabled): no C++
# toolchain or GPU driver requirement, which matters for the 3-OS CI matrix.
# Apache-2.0/MIT.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# Keep `esaxx_fast` off: that default enables `esaxx-rs/cpp`, which needs a
# working C++ stdlib. On some Linux VMs `/usr/bin/c++` is clang that selects a
# GCC install without matching libstdc++ headers (`cstdint` not found).
# Inference only needs load/encode; the pure-Rust esaxx path is enough.
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["progressbar", "onig"] }
# Opens the system browser for OAuth sign-in (core/oauth.rs). Already in the
# dependency tree transitively via tauri-plugin-opener; declared directly here
# because we call its Rust API, not just the frontend `opener` plugin command.
# MIT licensed (passes deny.toml).
open = "5"
# In-process TLS for the experimental MCP HTTP server (rustls + ring).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
# `tauri::test::mock_app()` + `Manager::manage`/`state` — the only supported
# way to build a real `tauri::State<T>` for command-layer tests, since
# `State`'s constructor is private outside the Tauri runtime machinery.
tauri = { version = "2", features = ["test"] }

[features]
default = []
profiling = ["tracing-chrome"]
# Experimental command surface (AI generation, observer mode, cloud sync,
# analytics, visual checks, data sources). Off by default so a stock build
# exposes only the trusted core (recording/replay, workflow storage,
# permissions, Organizer, compression, auth, diagnostics, updates). The
# underlying engine/core logic always compiles; this flag only gates the IPC
# command surface and the frontend panel that drives it. Also pulls in the
# local-model inference dependencies (core/local_llm.rs) — without this
# feature, `provider = "local_model"` degrades to the existing heuristic
# LocalFallback rather than failing to compile.
experimental = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:rustls", "dep:rustls-pemfile"]

[[bin]]
name = "mcp_relay_server"
path = "src/bin/mcp_relay_server.rs"
required-features = ["experimental"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
accessibility-sys = "0.2"
enigo = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.2"

# Headless/dev fallback (Linux containers, CI): replay-only backend so the
# crate compiles and the test suite runs everywhere (see platform/headless.rs).
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
enigo = "0.2"

[profile.dev]
# Explicit (matches cargo's own default) so iteration speed doesn't silently
# regress if that default ever changes; keeps rebuilds cheap during local dev.
incremental = true

[profile.release]
# Enable Link-Time Optimization for better runtime performance
lto = "thin"
# Optimize for performance over binary size
codegen-units = 1
# Strip debug symbols to reduce binary size
strip = true
# NOTE: do not set `panic = "abort"` here. The macOS recorder's CGEventTap
# callback contains panics at the FFI boundary via std::panic::catch_unwind,
# which the abort strategy disables — platform/macos.rs enforces this with a
# compile_error! guard (release builds fail on macOS with abort set).

[profile.release-with-debug]
inherits = "release"
# Keep debug info for profiling while maintaining optimizations
strip = false
debug = true
