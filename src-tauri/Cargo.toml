[package]
name = "ghost"
version = "1.1.0"
edition = "2021"

[lib]
name = "ghost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Signed auto-update. The app checks an endpoint, verifies the update signature
# against the embedded public key, and installs only after the user approves
# (see commands/updates.rs). Update artifacts + signatures are produced by the
# release workflow when the updater signing key is configured.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-chrome = { version = "0.7", optional = true }
image = "0.24"
ssim = "0.1"
rusttype = "0.9"
threadpool = "1.8"
base64 = "0.22"
async-trait = "0.1"
regex = "1.10"
dirs = "5"
argon2 = "0.5"
aes-gcm = "0.10"
# SHA-256 for the tamper-evident audit hash chain over Organizer executions
# (see storage/executions.rs). RustCrypto, MIT/Apache-2.0 (passes deny.toml).
sha2 = "0.10"
# Local trust-boundary storage (Zones + folder rules). `bundled` compiles
# SQLite from source so there is no system-library dependency and it builds on
# the headless Linux CI leg. MIT-licensed (passes deny.toml).
rusqlite = { version = "0.40", features = ["bundled"] }

[features]
default = []
profiling = ["tracing-chrome"]
# Experimental command surface (AI generation, observer mode, cloud sync,
# analytics, visual checks, data sources). Off by default so a stock build
# exposes only the trusted core (recording/replay, workflow storage,
# permissions, Organizer, compression, auth, diagnostics, updates). The
# underlying engine/core logic always compiles; this flag only gates the IPC
# command surface and the frontend panel that drives it.
experimental = []

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
accessibility-sys = "0.1"
enigo = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.2"

# Headless/dev fallback (Linux containers, CI): replay-only backend so the
# crate compiles and the test suite runs everywhere (see platform/headless.rs).
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
enigo = "0.2"
