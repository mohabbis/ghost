# Local development dependencies for Ghost Cloud.
#   docker compose up -d
#
# Host ports are overridable because 5432 and 6379 are frequently already taken
# by an unrelated Postgres or Redis on a developer machine. `scripts/lib.sh`
# probes for a port that genuinely answers as the ghost user and sets these,
# rather than assuming an open port is ours — see the comment at the top of that
# file for the failure that caused.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ghost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost
      POSTGRES_DB: ghost
    ports:
      - "${GHOST_PG_PORT:-5432}:5432"
    volumes:
      - ghost-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ghost-redis
    restart: unless-stopped
    ports:
      - "${GHOST_REDIS_PORT:-6379}:6379"
    volumes:
      - ghost-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ghost-postgres-data:
  ghost-redis-data:
