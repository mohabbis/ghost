name: Deploy Website

on:
  push:
    branches: [main, master]
    paths:
      - "public/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (ghost.muharafiq.com)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Verify public directory
        run: |
          test -d public || { echo "public/ directory not found" >&2; exit 1; }
          echo "Files to deploy:"
          find public -type f | sort
          echo "Total files: $(find public -type f | wc -l)"

      - name: Validate download links (live HTTP)
        run: |
          set -euo pipefail
          for path in Ghost.dmg Ghost_Setup.exe; do
            url="https://github.com/mohabbis/ghost/releases/latest/download/${path}"
            echo "Checking ${url}"
            # Follow redirects; require a successful final status. Releases must
            # already publish these assets — a 404 here means the site would
            # ship a broken download button.
            code=$(curl -fsIL -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "Download URL failed (HTTP ${code}): ${url}" >&2
              exit 1
            fi
            echo "OK ${path} (HTTP ${code})"
          done
          # Markup must still point at the canonical latest URLs.
          grep -q "github.com/mohabbis/ghost/releases/latest/download/Ghost.dmg" public/index.html
          grep -q "github.com/mohabbis/ghost/releases/latest/download/Ghost_Setup.exe" public/index.html

      - name: Validate SoftwareApplication JSON-LD
        run: |
          grep -q '"@type": "SoftwareApplication"' public/index.html \
            || { echo "Missing SoftwareApplication schema" >&2; exit 1; }
          # Extract JSON-LD blocks and parse them as JSON.
          python3 - <<'PY'
          import json, pathlib, re, sys
          html = pathlib.Path("public/index.html").read_text()
          blocks = re.findall(
              r'<script type="application/ld\+json">\s*(.*?)\s*</script>',
              html,
              flags=re.S,
          )
          if not blocks:
              print("No JSON-LD blocks found", file=sys.stderr)
              sys.exit(1)
          for i, block in enumerate(blocks, 1):
              json.loads(block)
              print(f"JSON-LD block {i}: OK")
          PY

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying public/ to Vercel…"
          vercel deploy --prod --token="${VERCEL_TOKEN}" --yes
          echo "Live: https://ghost.muharafiq.com"

      - name: Deployment summary
        run: |
          echo "Deployed $(find public -type f | wc -l) files from public/"
          echo "Site: https://ghost.muharafiq.com"
          echo "Downloads: GitHub Releases (latest)"
