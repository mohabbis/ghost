name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # Accept the signing secrets under either naming convention: the names this
      # workflow historically used, or the MACOS_*/alternate names documented in
      # docs/macos-signing-checklist.md. Missing secrets resolve to "" so the
      # `${A:-$B}` fallbacks pick whichever set the maintainer actually added.
      - name: Configure macOS signing
        env:
          CERT_A: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_B: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_C: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PW_A: ${{ secrets.P12_PASSWORD }}
          CERT_PW_B: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CERT_PW_C: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          IDENTITY_A: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IDENTITY_B: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID_A: ${{ secrets.APPLE_ID }}
          APPLE_ID_B: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PW_A: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PW_B: ${{ secrets.MACOS_APPLE_PASSWORD }}
          APPLE_PW_C: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_A: ${{ secrets.APPLE_TEAM_ID }}
          TEAM_B: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          CERT="${CERT_A:-${CERT_B:-$CERT_C}}"
          CERT_PW="${CERT_PW_A:-${CERT_PW_B:-$CERT_PW_C}}"
          IDENTITY="${IDENTITY_A:-$IDENTITY_B}"
          A_ID="${APPLE_ID_A:-$APPLE_ID_B}"
          A_PW="${APPLE_PW_A:-${APPLE_PW_B:-$APPLE_PW_C}}"
          TEAM="${TEAM_A:-$TEAM_B}"
          if [ -n "$CERT" ]; then
            echo "SIGNING_MODE=full" >> "$GITHUB_ENV"
            printf 'APPLE_CERTIFICATE<<__GHOST_EOF__\n%s\n__GHOST_EOF__\n' "$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${IDENTITY:--}" >> "$GITHUB_ENV"
            if [ -n "$A_ID" ] && [ -n "$A_PW" ] && [ -n "$TEAM" ]; then
              echo "APPLE_ID=$A_ID" >> "$GITHUB_ENV"
              echo "APPLE_PASSWORD=$A_PW" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
              echo "macOS signing: FULL (Developer ID cert found); notarization: ENABLED"
            else
              echo "macOS signing: FULL (Developer ID cert found); notarization: SKIPPED (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not all set under any known name)"
            fi
          else
            echo "SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "macOS signing: ADHOC (no Developer ID cert secret found — unsigned preview build)"
          fi

      - name: Build universal macOS DMG
        env:
          # When the updater signing key is configured, Tauri also emits the
          # signed updater tarball (.app.tar.gz + .sig). Signing runs over the
          # already-signed .app, so the order is correct. Without the key, the
          # build is exactly the previous DMG-only build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Updater signing key present -> producing signed updater artifacts"
            cargo tauri build --target universal-apple-darwin --bundles dmg \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater signing key -> DMG only, skipping updater artifacts"
            cargo tauri build --target universal-apple-darwin --bundles dmg
          fi

      - name: Stage macOS asset
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -z "$DMG" ]; then
            echo "No DMG found in Tauri bundle output" >&2
            exit 1
          fi
          cp "$DMG" Ghost.dmg
          mkdir -p public/downloads
          cp Ghost.dmg public/downloads/Ghost.dmg
          echo "Built $DMG -> Ghost.dmg"

      # The updater downloads the .app tarball (not the DMG); publish it and its
      # signature under stable names the manifest job references. No-op unless
      # the signing key produced the artifacts above.
      - name: Stage macOS updater artifacts
        run: |
          TARBALL=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" -print -quit || true)
          if [ -n "$TARBALL" ] && [ -f "$TARBALL.sig" ]; then
            cp "$TARBALL" Ghost.app.tar.gz
            cp "$TARBALL.sig" Ghost.app.tar.gz.sig
            echo "Staged updater artifacts: $TARBALL -> Ghost.app.tar.gz(.sig)"
          else
            echo "No macOS updater artifacts (updater signing key not configured)"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: Ghost.dmg
          fail_on_unmatched_files: true

      - name: Upload macOS updater artifacts
        if: ${{ hashFiles('Ghost.app.tar.gz') != '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Ghost.app.tar.gz
            Ghost.app.tar.gz.sig
          fail_on_unmatched_files: false

      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-website-binary
          path: public/downloads/Ghost.dmg
          retention-days: 7

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          # With the updater signing key set, Tauri emits the installer's .sig
          # (computed over the exact installer bytes we publish). Without it,
          # this is the previous plain installer build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "Updater signing key present -> producing signed updater artifacts"
            cargo tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          } else {
            Write-Host "No updater signing key -> installer only, skipping updater artifacts"
            cargo tauri build --bundles nsis
          }

      - name: Stage Windows asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found in src-tauri\target\release\bundle\nsis"
            exit 1
          }
          Copy-Item $installer.FullName Ghost_Setup.exe
          New-Item -ItemType Directory -Force -Path public\downloads | Out-Null
          Copy-Item Ghost_Setup.exe public\downloads\Ghost_Setup.exe
          Write-Host "Built: $($installer.FullName) -> Ghost_Setup.exe"
          # The updater downloads Ghost_Setup.exe and verifies it against this
          # signature; publish it under a stable name for the manifest job.
          $sig = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName Ghost_Setup.exe.sig
            Write-Host "Staged updater signature: $($sig.FullName) -> Ghost_Setup.exe.sig"
          } else {
            Write-Host "No Windows updater signature (updater signing key not configured)"
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: Ghost_Setup.exe
          fail_on_unmatched_files: true

      - name: Upload Windows updater signature
        if: ${{ hashFiles('Ghost_Setup.exe.sig') != '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: Ghost_Setup.exe.sig
          fail_on_unmatched_files: false

      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-website-binary
          path: public/downloads/Ghost_Setup.exe
          retention-days: 7

  # Assemble and publish latest.json — the manifest the updater reads. Runs
  # after both builds; a no-op unless the signing key produced updater
  # signatures (so downloads keep working before auto-update is configured).
  publish-manifest:
    name: Publish updater manifest
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --dir sigs \
            --pattern 'Ghost.app.tar.gz.sig' --pattern 'Ghost_Setup.exe.sig' || true
          if [ ! -f sigs/Ghost.app.tar.gz.sig ] || [ ! -f sigs/Ghost_Setup.exe.sig ]; then
            echo "Updater signatures not published -> skipping latest.json (auto-update not configured)"
            exit 0
          fi
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --arg notes "See the release notes: https://github.com/${REPO}/releases/tag/${TAG}" \
            --arg mac_url "${base}/Ghost.app.tar.gz" \
            --arg win_url "${base}/Ghost_Setup.exe" \
            --rawfile mac_sig sigs/Ghost.app.tar.gz.sig \
            --rawfile win_sig sigs/Ghost_Setup.exe.sig \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64":  { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
